let currentIndex = parseInt(localStorage.getItem("currentIndex")) || 0;
let songTime = parseFloat(localStorage.getItem("songTime")) || 0;

if (localStorage.getItem("isPlaying") === null) {
  localStorage.setItem("isPlaying", "false");
}
function shuffle(array) {
  let arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initQueue() {
  playQueue = shuffle(songs);
  currentIndex = 0;
  localStorage.setItem("playQueue", JSON.stringify(playQueue));
  localStorage.setItem("currentIndex", 0);
}

if (playQueue.length === 0) {
  initQueue();
}

const player = document.getElementById("song-player");

function loadSong() {
  const s = playQueue[currentIndex];
  document.getElementById("song-title").innerText = s.title;
  document.getElementById("song-artist").innerText = s.artist;
  player.src = s.url;
  player.currentTime = songTime;
  const isPlaying = localStorage.getItem("isPlaying") === "true";

if (isPlaying) {
  player.play();
}
}

function nextSong() {
  currentIndex++;

  if (currentIndex >= playQueue.length) {
    initQueue(); // 全部播完 → 重新洗牌
    currentIndex = 0;
  }

  songTime = 0;
  localStorage.setItem("songTime", 0);
  localStorage.setItem("currentIndex", currentIndex);
  loadSong();
}

// 记住播放进度
player.addEventListener("timeupdate", () => {
  localStorage.setItem("songTime", player.currentTime);
});

player.addEventListener("ended", () => {
  localStorage.setItem("isPlaying", "true");
  nextSong();
});

player.addEventListener("play", () => {
  localStorage.setItem("isPlaying", "true");
});

player.addEventListener("pause", () => {
  localStorage.setItem("isPlaying", "false");
});

loadSong();

<!-- ====== 运行时间 + 文章数统计 ====== -->
<script>
  const startTime = new Date("2026-01-16T15:26:00"); // ← 改成你建站时间

  function updateRuntime() {
    const now = new Date();
    let diff = Math.floor((now - startTime) / 1000);

    const days = Math.floor(diff / 86400);
    diff %= 86400;
    const hours = Math.floor(diff / 3600);
    diff %= 3600;
    const minutes = Math.floor(diff / 60);
    const seconds = diff % 60;

    const el = document.getElementById("site-runtime");
    if (el) {
      el.innerHTML = `已稳定运行 <b>${days}</b> 天 <b>${hours}</b> 小时 <b>${minutes}</b> 分钟 <b>${seconds}</b> 秒`;
    }
  }

  setInterval(updateRuntime, 1000);
  updateRuntime();
</script>
